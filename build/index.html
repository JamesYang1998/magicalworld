    // Create role toggle component

    // Render sample tasks page for KOLs
    function renderSampleTasksPage() {

      app.innerHTML = `
        <div class="min-h-screen bg-gray-100">

                      <label class="block text-sm font-medium text-gray-700 mb-2">Current Follower Count</label>
                      <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="Example: 5000">
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">Main Content Focus</label>
                      <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="Meme">Meme</option>
                        <option value="Investment">Investment Research</option>

                        <option value="Other">Other</option>

      // Add event listener for back button to always go to homepage
      document.getElementById('back-to-home').addEventListener('click', handleLogoClick);

      // Add event listener for Twitter verification button
      const verifyTwitterBtn = document.getElementById('verify-twitter-btn');
      if (verifyTwitterBtn) {
        verifyTwitterBtn.addEventListener('click', function() {
          // Open Twitter authorization page
          window.location.href = 'twitter-auth.html';
        });
      }
      
      // Load existing profile data if available
      if (window.api && typeof window.api.getProfileFromLocalStorage === 'function') {
        const existingProfile = window.api.getProfileFromLocalStorage();
        if (existingProfile) {
          // Fill form fields with existing data
          const platformSelect = document.querySelector('select[class*="border-gray-300"]:first-of-type');
          const platformLinkInput = document.querySelector('input[placeholder*="Platform Account Link"]');
          const followerCountInput = document.querySelector('input[placeholder*="Example: 5000"]');
          const contentFocusSelect = document.querySelector('select[class*="border-gray-300"]:nth-of-type(2)');
          const priceInput = document.querySelector('input[placeholder*="Example: 400"]');
          const walletInput = document.querySelector('input[placeholder*="BSC wallet address"]');
          
          if (platformSelect) platformSelect.value = existingProfile.platform || '';
          if (platformLinkInput) platformLinkInput.value = existingProfile.platform_link || '';
          if (followerCountInput) followerCountInput.value = existingProfile.followers_count || '';
          if (contentFocusSelect) contentFocusSelect.value = existingProfile.content_focus || '';
          if (priceInput) priceInput.value = existingProfile.price_per_post || '';
          if (walletInput) walletInput.value = existingProfile.wallet_address || '';
          
          console.log('Loaded existing profile data:', existingProfile);
        }
      }
      
      // Add event listener for save profile button
      const saveProfileBtn = document.getElementById('save-profile-btn');
      if (saveProfileBtn) {
        saveProfileBtn.addEventListener('click', async function() {
          try {
            // Get form data with more robust selectors
            let platformSelect = document.querySelector('select[class*="border-gray-300"]');
            let platformLinkInput = document.querySelector('input[placeholder*="Platform Account Link"], input[placeholder*="https://twitter.com"]');
            let followerCountInput = document.querySelector('input[placeholder*="Example: 5000"], input[placeholder*="5000"]');
            let contentFocusSelect = document.querySelector('select[class*="border-gray-300"]:nth-of-type(2)');
            let priceInput = document.querySelector('input[placeholder*="Example: 400"], input[placeholder*="400"]');
            let walletInput = document.querySelector('input[placeholder*="BSC wallet address"], input[placeholder*="BSC"]');
            
            // Debug form element detection
            console.log('Form elements found:', {
              platformSelect: !!platformSelect,
              platformLinkInput: !!platformLinkInput,
              followerCountInput: !!followerCountInput,
              contentFocusSelect: !!contentFocusSelect,
              priceInput: !!priceInput,
              walletInput: !!walletInput
            });
            
            // Fallback selectors if the specific ones fail
            if (!platformSelect) {
              platformSelect = document.querySelectorAll('select')[0];
            }
            if (!contentFocusSelect) {
              contentFocusSelect = document.querySelectorAll('select')[1];
            }
            if (!platformLinkInput) {
              platformLinkInput = document.querySelector('input[type="text"]:nth-of-type(1)');
            }
            if (!followerCountInput) {
              followerCountInput = document.querySelector('input[type="number"]:nth-of-type(1), input[type="text"]:nth-of-type(2)');
            }
            if (!priceInput) {
              priceInput = document.querySelector('input[type="number"]:nth-of-type(2), input[type="text"]:nth-of-type(3)');
            }
            if (!walletInput) {
              walletInput = document.querySelector('input[type="text"]:nth-of-type(4), input[type="text"]:last-of-type');
            }
            
            // Final check with more detailed error
            if (!platformSelect || !platformLinkInput || !followerCountInput || 
                !contentFocusSelect || !priceInput || !walletInput) {
              const missingFields = [];
              if (!platformSelect) missingFields.push('Platform Selection');
              if (!platformLinkInput) missingFields.push('Platform Account Link');
              if (!followerCountInput) missingFields.push('Follower Count');
              if (!contentFocusSelect) missingFields.push('Content Focus');
              if (!priceInput) missingFields.push('Price Per Post');
              if (!walletInput) missingFields.push('Wallet Address');
              
              throw new Error(`Unable to get form data: ${missingFields.join(', ')}`);
            }
            
            // Create profile data object with safe value extraction
            const profileData = {
              platform: platformSelect.value || 'Twitter',
              platform_link: platformLinkInput.value || '',
              followers_count: parseInt(followerCountInput.value) || 0,
              content_focus: contentFocusSelect.value || 'Meme',
              price_per_post: parseInt(priceInput.value) || 0,
              wallet_address: walletInput.value || ''
            };
            
            console.log('Saving profile data:', profileData);
            
            try {
              // Always save to localStorage first as a backup
              localStorage.setItem('kol_profile', JSON.stringify(profileData));
              
              // Then try API if available
              if (window.api && typeof window.api.saveKolProfile === 'function') {
                await window.api.saveKolProfile(profileData);
              }
              
              // Show success notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('Profile saved successfully!', 'success');
              } else {
                showNotification('Profile saved successfully!', 'success');
              }
              
              // Redirect to home page
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1000); // Delay to show notification
            } catch (error) {
              console.error('Error saving profile:', error);
              
              // Show error notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('Failed to save to API, but saved to local storage.', 'info');
              } else {
                showNotification('Failed to save to API, but saved to local storage.', 'info');
              }
              
              // Still redirect since we saved to localStorage
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1500);
            }
          } catch (error) {
            console.error('Failed to save profile:', error);
            
            // Show detailed error notification
            if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
              window.twitterAuth.showNotification(`Failed to save profile: ${error.message}`, 'error');
            } else {
              showNotification(`Failed to save profile: ${error.message}`, 'error');
            }
          }
        });
      }
      
      // Check if returning from Twitter auth
      const twitterAuthSuccess = localStorage.getItem('twitter_auth_success') === 'true';
      if (twitterAuthSuccess) {
        // Clear the flag
        localStorage.removeItem('twitter_auth_success');
        // Get stored Twitter data
        const twitterData = JSON.parse(localStorage.getItem('twitter_auth_data'));
        
        if (twitterData) {
          // Update follower count field
          const followerCountInput = document.querySelector('input[placeholder="Example: 5000"]');
          if (followerCountInput) {
            followerCountInput.value = twitterData.followers_count;
          }
          
          // Update verify button to show verified status
          if (verifyTwitterBtn) {
            verifyTwitterBtn.innerHTML = '✓ Verified';
            verifyTwitterBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            verifyTwitterBtn.classList.add('verified');
            verifyTwitterBtn.disabled = true;
          }
          
          // Show success notification
          showNotification('Twitter account verified successfully!', 'success');
        }
      }
    }

    // Global variable to track navigation timeouts

    // Global function for consistent navigation
    function navigateTo(hash) {
      console.log(`Navigating to ${hash}`);
      
      // Clear any existing navigation timeouts
      if (window.navigationTimeout) {
        clearTimeout(window.navigationTimeout);
      }
      
      // Set the hash to navigate
      window.location.hash = hash;
      
      // Set a fallback timeout to force navigation if hash change doesn't trigger
      window.navigationTimeout = setTimeout(function() {
        if (window.location.hash !== hash) {
          console.log('Navigation timeout triggered, forcing reload');
          window.location.reload();
        }
      }, 2000);
      
      return false; // Prevent default behavior
    }

    // Global function for handling role toggle consistently across all pages
    function handleRoleToggle(event) {
      if (event) {
        event.preventDefault();
      }
      
      console.log('Role toggle clicked, updating role and navigating');
      
      try {
        const currentRole = localStorage.getItem('selectedRole') || UserRole.KOL;

        // Always toggle the role regardless of current page
        if (currentRole === UserRole.KOL) {
          localStorage.setItem('selectedRole', UserRole.PUBLISHER);
          console.log('Role changed to PUBLISHER, navigating to publisher page');
          window.location.hash = '#/publisher';
        } else {
          localStorage.setItem('selectedRole', UserRole.KOL);
          console.log('Role changed to KOL, navigating to sample tasks page');
          window.location.hash = '#/sample-tasks';
        }
        
        // Add a fallback navigation mechanism

          const expectedHash = currentRole === UserRole.KOL ? '#/publisher' : '#/sample-tasks';
          if (window.location.hash !== expectedHash) {
            console.log('Navigation failed, forcing navigation');
            window.location.hash = expectedHash;
          }
        }, 500);
      } catch (error) {
        console.error('Error handling role toggle:', error);
        showNotification('Error switching roles, please try again', 'error');
      }
      
      return false;
    }
    
    // Initialize the app

      if (hashPath === '#/sample-tasks') {
        renderSampleTasksPage();
      } else if (hashPath === '#/publisher') {
        renderPublisherPage();
      } else if (hashPath === '#/kol-profile') {

        try {
          // Clear any existing navigation timeouts
          if (window.navigationTimeout) {
            clearTimeout(window.navigationTimeout);
            window.navigationTimeout = null;
          }
          
          // Track navigation start time for performance monitoring

          console.log(`Starting navigation to ${hashPath} at ${navigationStartTime}`);
          
          if (hashPath === '#/sample-tasks') {
            renderSampleTasksPage();
          } else if (hashPath === '#/publisher') {
            renderPublisherPage();
          } else if (hashPath === '#/kol-profile') {
            renderSampleTasksPage(); // KOL profile is part of the sample tasks page
          } else if (hashPath === '#/home') {
            renderHomePage(); // New home page
          } else {
            renderLandingPage();
          }
          
          // Log navigation completion time
          const navigationEndTime = new Date().getTime();
          console.log(`Completed navigation to ${hashPath} in ${navigationEndTime - navigationStartTime}ms`);
        } catch (error) {
          console.error('Error rendering page:', error);
          showNotification('Error loading page, please try again', 'error');
