    // Render landing page

    // Create role toggle component
    function createRoleToggle() {
      const selectedRole = localStorage.getItem('selectedRole') || UserRole.KOL;
      const isPublisher = selectedRole === UserRole.PUBLISHER;
      
      return `
        <div class="flex items-center space-x-4">
          <div class="flex items-center bg-gray-200 rounded-full p-1 cursor-pointer" id="role-toggle-container">
            <div class="flex items-center ${isPublisher ? '' : 'bg-white rounded-full shadow'} px-3 py-1 transition-all">

            </div>

            </div>
          </div>

            ${i18n.translate('languageToggle')}

    // Render sample tasks page for KOLs
    function renderSampleTasksPage() {
      const selectedRole = localStorage.getItem('selectedRole') || UserRole.KOL;
      const tasks = getSampleTasks();
      
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="min-h-screen bg-gray-100">
          <!-- Header -->
          <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                  ${createRoleToggle()}
                </div>
              </div>
            </div>
          </header>
          
          <!-- Main Content -->
          <main>
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
              <div class="mb-6">
                <div class="flex items-center justify-between">
                  <h1 class="text-2xl font-bold">${i18n.translate('sampleTasksTitle')}</h1>
                </div>
                <p class="mt-2 text-gray-600">
                  ${i18n.translate('sampleTasksSubtitle')}
                </p>
              </div>
              
              <!-- KOL Profile Section with BSC Wallet Address -->
              <div class="mb-6 bg-white shadow rounded-lg overflow-hidden">
                <div class="p-6">
                  <h2 class="text-xl font-semibold mb-6">${i18n.translate('profileTitle')}</h2>
                  <div class="grid grid-cols-1 gap-5">
                    <!-- Single Column Layout -->

                        <option value="YouTube" disabled>YouTube (${i18n.translate('comingSoon')})</option>
                        <option value="TikTok" disabled>TikTok (${i18n.translate('comingSoon')})</option>
                      </select>
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profilePlatform')} ${i18n.translate('profileLink')}</label>
                      <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="https://twitter.com/yourusername">
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profileFollowers')}</label>
                      <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="5000">
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profileContent')}</label>
                      <select class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
                        <option value="Meme">Meme</option>
                        <option value="Research">${i18n.translate('profileContentResearch')}</option>
                        <option value="Tutorial">${i18n.translate('profileContentTutorial')}</option>
                        <option value="Other">${i18n.translate('profileContentOther')}</option>
                      </select>
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profilePrice')}</label>
                      <input type="number" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="400">
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profileWallet')}</label>
                      <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" placeholder="0x...">
                    </div>
                    
                    <div class="mb-4">
                      <label class="block text-sm font-medium text-gray-700 mb-2">${i18n.translate('profileVerify')}</label>
                      <button class="btn-standard" id="verify-twitter-btn">
                        ${i18n.translate('profileVerify')}
                      </button>
                    </div>
                  </div>
                  <div class="mt-6 flex justify-end">
                    <button id="save-profile-btn" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition-colors">
                      ${i18n.translate('profileSave')}
                    </button>
                  </div>
                </div>
              </div>
              


            </div>
          </main>
          
          <!-- Footer -->
          <footer class="bg-white border-t border-gray-200 py-4">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <p class="text-center text-sm text-gray-500">
                &copy; ${new Date().getFullYear()} ACF Engine. ${i18n.translate('footerRights')}
              </p>
            </div>
          </footer>
        </div>
      `;

      // Add event listener for back button to always go to homepage
      document.getElementById('back-to-home').addEventListener('click', handleLogoClick);
      
      // Add event listener for role toggle using the global handler
      document.getElementById('role-toggle-container').addEventListener('click', handleRoleToggle);
      
      // Add event listener for language toggle
      document.getElementById('language-toggle').addEventListener('click', function() {
        i18n.switchLanguage();
      });
      
      // Add event listener for Twitter verification button
      const verifyTwitterBtn = document.getElementById('verify-twitter-btn');
      if (verifyTwitterBtn) {
        verifyTwitterBtn.addEventListener('click', function() {
          // Open Twitter authorization page
          window.location.href = 'twitter-auth.html';
        });
      }
      
      // Load existing profile data if available
      if (window.api && typeof window.api.getProfileFromLocalStorage === 'function') {
        const existingProfile = window.api.getProfileFromLocalStorage();
        if (existingProfile) {
          // Fill form fields with existing data
          const platformSelect = document.querySelector('select[class*="border-gray-300"]:first-of-type');
          const platformLinkInput = document.querySelector('input[placeholder*="平台账号链接"]');
          const followerCountInput = document.querySelector('input[placeholder*="例如：5000"]');
          const contentFocusSelect = document.querySelector('select[class*="border-gray-300"]:nth-of-type(2)');
          const priceInput = document.querySelector('input[placeholder*="例如：400"]');
          const walletInput = document.querySelector('input[placeholder*="BSC钱包地址"]');
          
          if (platformSelect) platformSelect.value = existingProfile.platform || '';
          if (platformLinkInput) platformLinkInput.value = existingProfile.platform_link || '';
          if (followerCountInput) followerCountInput.value = existingProfile.followers_count || '';
          if (contentFocusSelect) contentFocusSelect.value = existingProfile.content_focus || '';
          if (priceInput) priceInput.value = existingProfile.price_per_post || '';
          if (walletInput) walletInput.value = existingProfile.wallet_address || '';
          
          console.log('Loaded existing profile data:', existingProfile);
        }
      }
      
      // Add event listener for save profile button
      const saveProfileBtn = document.getElementById('save-profile-btn');
      if (saveProfileBtn) {
        saveProfileBtn.addEventListener('click', async function() {
          try {
            // Get form data with more robust selectors
            let platformSelect = document.querySelector('select[class*="border-gray-300"]');
            let platformLinkInput = document.querySelector('input[placeholder*="平台账号链接"], input[placeholder*="https://twitter.com"]');
            let followerCountInput = document.querySelector('input[placeholder*="例如：5000"], input[placeholder*="5000"]');
            let contentFocusSelect = document.querySelector('select[class*="border-gray-300"]:nth-of-type(2)');
            let priceInput = document.querySelector('input[placeholder*="例如：400"], input[placeholder*="400"]');
            let walletInput = document.querySelector('input[placeholder*="BSC钱包地址"], input[placeholder*="BSC"]');
            
            // Debug form element detection
            console.log('Form elements found:', {
              platformSelect: !!platformSelect,
              platformLinkInput: !!platformLinkInput,
              followerCountInput: !!followerCountInput,
              contentFocusSelect: !!contentFocusSelect,
              priceInput: !!priceInput,
              walletInput: !!walletInput
            });
            
            // Fallback selectors if the specific ones fail
            if (!platformSelect) {
              platformSelect = document.querySelectorAll('select')[0];
            }
            if (!contentFocusSelect) {
              contentFocusSelect = document.querySelectorAll('select')[1];
            }
            if (!platformLinkInput) {
              platformLinkInput = document.querySelector('input[type="text"]:nth-of-type(1)');
            }
            if (!followerCountInput) {
              followerCountInput = document.querySelector('input[type="number"]:nth-of-type(1), input[type="text"]:nth-of-type(2)');
            }
            if (!priceInput) {
              priceInput = document.querySelector('input[type="number"]:nth-of-type(2), input[type="text"]:nth-of-type(3)');
            }
            if (!walletInput) {
              walletInput = document.querySelector('input[type="text"]:nth-of-type(4), input[type="text"]:last-of-type');
            }
            
            // Final check with more detailed error
            if (!platformSelect || !platformLinkInput || !followerCountInput || 
                !contentFocusSelect || !priceInput || !walletInput) {
              const missingFields = [];
              if (!platformSelect) missingFields.push('平台选择');
              if (!platformLinkInput) missingFields.push('平台账号链接');
              if (!followerCountInput) missingFields.push('粉丝数');
              if (!contentFocusSelect) missingFields.push('内容方向');
              if (!priceInput) missingFields.push('单条报价');
              if (!walletInput) missingFields.push('钱包地址');
              
              throw new Error(`无法获取表单数据: ${missingFields.join(', ')}`);
            }
            
            // Create profile data object with safe value extraction
            const profileData = {
              platform: platformSelect.value || 'Twitter',
              platform_link: platformLinkInput.value || '',
              followers_count: parseInt(followerCountInput.value) || 0,
              content_focus: contentFocusSelect.value || 'Meme',
              price_per_post: parseInt(priceInput.value) || 0,
              wallet_address: walletInput.value || ''
            };
            
            console.log('Saving profile data:', profileData);
            
            try {
              // Always save to localStorage first as a backup
              localStorage.setItem('kol_profile', JSON.stringify(profileData));
              
              // Then try API if available
              if (window.api && typeof window.api.saveKolProfile === 'function') {
                await window.api.saveKolProfile(profileData);
              }
              
              // Show success notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('个人资料保存成功！', 'success');
              } else {
                showNotification('个人资料保存成功！', 'success');
              }
              
              // Redirect to home page
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1000); // Delay to show notification
            } catch (error) {
              console.error('保存个人资料时出错:', error);
              
              // Show error notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('保存到API失败，但已保存到本地存储。', 'info');
              } else {
                showNotification('保存到API失败，但已保存到本地存储。', 'info');
              }
              
              // Still redirect since we saved to localStorage
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1500);
            }
          } catch (error) {
            console.error('保存个人资料失败:', error);
            
            // Show detailed error notification
            if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
              window.twitterAuth.showNotification(`保存个人资料失败: ${error.message}`, 'error');
            } else {
              showNotification(`保存个人资料失败: ${error.message}`, 'error');
            }
          }
        });
      }
      
      // Check if returning from Twitter auth
      const twitterAuthSuccess = localStorage.getItem('twitter_auth_success') === 'true';
      if (twitterAuthSuccess) {
        // Clear the flag
        localStorage.removeItem('twitter_auth_success');
        // Get stored Twitter data
        const twitterData = JSON.parse(localStorage.getItem('twitter_auth_data'));
        
        if (twitterData) {
          // Update follower count field
          const followerCountInput = document.querySelector('input[placeholder="5000"]');
          if (followerCountInput) {
            followerCountInput.value = twitterData.followers_count;
          }
          
          // Update verify button to show verified status
          if (verifyTwitterBtn) {
            verifyTwitterBtn.innerHTML = '✓ ' + i18n.translate('profileVerified');
            verifyTwitterBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            verifyTwitterBtn.classList.add('verified');
            verifyTwitterBtn.disabled = true;
          }
          
          // Show success notification
          showNotification(i18n.translate('notifyTwitterVerified'), 'success');
        }
      }
    }

    // Global function for consistent navigation
    function navigateTo(hash) {
      console.log(`Navigating to ${hash}`);
      
      // Clear any existing navigation timeouts
      if (window.navigationTimeout) {
        clearTimeout(window.navigationTimeout);
      }
      
      // Set the hash to navigate
      window.location.hash = hash;
      
      // Set a fallback timeout to force navigation if hash change doesn't trigger
      window.navigationTimeout = setTimeout(function() {
        if (window.location.hash !== hash) {
          console.log('Navigation timeout triggered, forcing reload');
          window.location.reload();
        }
      }, 2000);
      
      return false; // Prevent default behavior
    }

          } else if (hashPath === '#/publisher') {
            renderPublisherPage();
          } else if (hashPath === '#/kol-profile') {
            renderSampleTasksPage(); // KOL profile is part of the sample tasks page
          } else if (hashPath === '#/home') {
            renderHomePage(); // New home page
          } else {
            renderLandingPage();
          }
          
          // Log navigation completion time
          const navigationEndTime = new Date().getTime();
          console.log(`Completed navigation to ${hashPath} in ${navigationEndTime - navigationStartTime}ms`);
        } catch (error) {
          console.error('Error rendering page:', error);
          showNotification('页面加载出错，请重试', 'error');
          // Fallback to landing page if rendering fails
          renderLandingPage();
        }
      });
    };
  </script>

  <!-- API Integration Script -->
  <script src="js/api.js"></script>
  
  <script>
    // Force cache refresh
    document.addEventListener('DOMContentLoaded', function() {
      const timestamp = new Date().getTime();
      const buttons = document.querySelectorAll('.btn-standard');
      buttons.forEach(button => {
        button.setAttribute('data-version', timestamp);
      });
    });
  </script>
</body>
