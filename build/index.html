    // Task application data structure functions
    
    // Function to get applied tasks from localStorage
    function getAppliedTasks() {
      try {
        const appliedTasks = localStorage.getItem('appliedTasks');
        return appliedTasks ? JSON.parse(appliedTasks) : {};
      } catch (error) {
        console.error('Error getting applied tasks:', error);
        return {};
      }
    }
    
    // Function to save applied tasks to localStorage
    function saveAppliedTask(taskId, returnLink = '') {
      try {
        const appliedTasks = getAppliedTasks();
        appliedTasks[taskId] = {
          applied: true,
          returnLink: returnLink,
          appliedAt: new Date().toISOString()
        };
        localStorage.setItem('appliedTasks', JSON.stringify(appliedTasks));
        return true;
      } catch (error) {
        console.error('Error saving applied task:', error);
        return false;
      }
    }
    
    // Function to check if a task is applied
    function isTaskApplied(taskId) {
      try {
        const appliedTasks = getAppliedTasks();
        return appliedTasks[taskId] && appliedTasks[taskId].applied;
      } catch (error) {
        console.error('Error checking if task is applied:', error);
        return false;
      }
    }
    
    // Function to get return link for a task
    function getTaskReturnLink(taskId) {
      try {
        const appliedTasks = getAppliedTasks();
        return appliedTasks[taskId] ? appliedTasks[taskId].returnLink : '';
      } catch (error) {
        console.error('Error getting task return link:', error);
        return '';
      }
    }

              contentFocusSelect: !!contentFocusSelect,
              priceInput: !!priceInput,

            });
            
            // Fallback selectors if the specific ones fail
            if (!platformSelect) {
              platformSelect = document.querySelectorAll('select')[0];
            }
            if (!contentFocusSelect) {
              contentFocusSelect = document.querySelectorAll('select')[1];
            }
            if (!platformLinkInput) {

            if (!followerCountInput) {
              followerCountInput = document.querySelector('input[type="number"]:nth-of-type(1), input[type="text"]:nth-of-type(2)');

            if (!priceInput) {
              priceInput = document.querySelector('input[type="number"]:nth-of-type(2), input[type="text"]:nth-of-type(3)');
            }
            if (!walletInput) {
              walletInput = document.querySelector('input[type="text"]:nth-of-type(4), input[type="text"]:last-of-type');
            }
            
            // Final check with more detailed error
            if (!platformSelect || !platformLinkInput || !followerCountInput || 
                !contentFocusSelect || !priceInput || !walletInput) {
              const missingFields = [];
              if (!platformSelect) missingFields.push('平台选择');
              if (!platformLinkInput) missingFields.push('平台账号链接');
              if (!followerCountInput) missingFields.push('粉丝数');

              if (!walletInput) missingFields.push('钱包地址');

              platform_link: platformLinkInput.value || '',
              followers_count: parseInt(followerCountInput.value) || 0,
              content_focus: contentFocusSelect.value || 'Meme',
              price_per_post: parseInt(priceInput.value) || 0,
              wallet_address: walletInput.value || ''
            };
            
            console.log('Saving profile data:', profileData);
            
            try {
              // Always save to localStorage first as a backup
              localStorage.setItem('kol_profile', JSON.stringify(profileData));
              
              // Then try API if available
              if (window.api && typeof window.api.saveKolProfile === 'function') {
                await window.api.saveKolProfile(profileData);
              }
              
              // Show success notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('个人资料保存成功！', 'success');
              } else {
                showNotification('个人资料保存成功！', 'success');
              }
              
              // Redirect to home page
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1000); // Delay to show notification
            } catch (error) {
              console.error('保存个人资料时出错:', error);
              
              // Show error notification
              if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
                window.twitterAuth.showNotification('保存到API失败，但已保存到本地存储。', 'info');
              } else {
                showNotification('保存到API失败，但已保存到本地存储。', 'info');
              }
              
              // Still redirect since we saved to localStorage
              setTimeout(() => {
                window.location.hash = '#/home';
              }, 1500);
            }
          } catch (error) {
            console.error('保存个人资料失败:', error);
            
            // Show detailed error notification
            if (window.twitterAuth && typeof window.twitterAuth.showNotification === 'function') {
              window.twitterAuth.showNotification(`保存个人资料失败: ${error.message}`, 'error');
            } else {
              showNotification(`保存个人资料失败: ${error.message}`, 'error');
            }
          }
        });
      }
      
      // Check if returning from Twitter auth
      const twitterAuthSuccess = localStorage.getItem('twitter_auth_success') === 'true';
      if (twitterAuthSuccess) {
        // Clear the flag
        localStorage.removeItem('twitter_auth_success');
        // Get stored Twitter data
        const twitterData = JSON.parse(localStorage.getItem('twitter_auth_data'));
        
        if (twitterData) {
          // Update follower count field
          const followerCountInput = document.querySelector('input[placeholder="例如：5000"]');
          if (followerCountInput) {
            followerCountInput.value = twitterData.followers_count;
          }
          
          // Update verify button to show verified status
          if (verifyTwitterBtn) {
            verifyTwitterBtn.innerHTML = '✓ 已验证';
            verifyTwitterBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            verifyTwitterBtn.classList.add('verified');
            verifyTwitterBtn.disabled = true;
          }
          
          // Show success notification
          showNotification('Twitter账户验证成功！', 'success');
        }
      }
    }

          // Collect form data
          const taskTitle = document.querySelector('input[placeholder="例如：新产品宣发活动"]').value;
          const taskDescription = document.querySelector('textarea[placeholder="详细描述您的营销需求..."]').value;

          const wordCount = document.querySelector('input[placeholder="例如：200"]').value;
          const paymentInfo = document.querySelector('input[placeholder="BSC钱包地址"]').value;
          
          // Validate form data
          if (!taskTitle || !taskDescription || !contentRequirements || !platform || !platformRequirements || !commission) {
            showNotification('请填写所有必填字段', 'error');
            return;
          }
          
          // Create task object
          const newTask = {
            title: taskTitle,
            description: taskDescription,
            requirements: contentRequirements,
            platform: platform,
            platform_requirements: platformRequirements,
            commission: parseInt(commission),
            word_count: parseInt(wordCount) || 0,
            payment_info: paymentInfo,
            status: 'open',
            created_at: new Date().toISOString()
          };
          
          // Store the new task in localStorage
          localStorage.setItem('newlyCreatedTask', JSON.stringify(newTask));
          
          // Show success notification
          showNotification('任务发布成功！', 'success');

                window.location.hash = '#/home';
                
                // If still not navigating, try a page reload as a last resort

    // Function to show notification
    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `fixed top-4 right-4 p-4 rounded-lg shadow-lg ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-blue-500'} text-white z-50`;
      notification.textContent = message;
      document.body.appendChild(notification);
      
      // Remove notification after 3 seconds
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }
    
    // Global function to handle task application
    function handleTaskApplication(taskId, button) {
      // Check if user is a KOL
      const userRole = localStorage.getItem('selectedRole') || UserRole.KOL;
      if (userRole !== UserRole.KOL) {
        showNotification('只有KOL用户可以申请任务', 'error');
        return;
      }
      
      // Check if task is already applied
      const isApplied = isTaskApplied(taskId);
      
      if (!isApplied) {
        // Apply for the task
        applyForTask(taskId, button);
      } else {
        // Cancel the task application
        cancelTaskApplication(taskId, button);
      }
    }
    
    // Function to apply for a task
    function applyForTask(taskId, button) {
      // Immediately update button state to green with "已申请" text
      button.textContent = '已申请';
      button.classList.add('verified');
      
      // Save the task application with empty return link for now
      saveAppliedTask(taskId, '');
      
      // Show success notification
      showNotification('任务申请成功！', 'success');
      
      // Show return link dialog
      const dialogId = `return-link-dialog-${taskId}`;
      const dialog = document.getElementById(dialogId);
      
      if (dialog) {
        dialog.style.display = 'block';
        
        // Focus on the input field
        const inputField = dialog.querySelector('input');
        if (inputField) {
          inputField.focus();
        }
      } else {
        console.error(`Dialog with ID ${dialogId} not found`);
        showNotification('申请任务失败，请重试', 'error');
      }
      
      // Add hover event listeners
      addButtonHoverEvents(button);
    }
    
    // Function to cancel a task application
    function cancelTaskApplication(taskId, button) {
      // Remove the task from applied tasks
      const appliedTasks = JSON.parse(localStorage.getItem('appliedTasks') || '{}');
      delete appliedTasks[taskId];
      localStorage.setItem('appliedTasks', JSON.stringify(appliedTasks));
      
      // Update button state back to blue with "申请任务" text
      button.textContent = '申请任务';
      button.classList.remove('verified');
      
      // Hide return link dialog
      const dialogId = `return-link-dialog-${taskId}`;
      const dialog = document.getElementById(dialogId);
      if (dialog) {
        dialog.style.display = 'none';
      }
      
      // Show notification
      showNotification('已取消申请任务', 'info');
    }
    
    // Function to add hover events to buttons
    function addButtonHoverEvents(button) {
      if (button.classList.contains('verified')) {
        // Store original text
        const originalText = button.textContent;
        
        // Add mouseover event
        button.addEventListener('mouseover', function() {
          if (this.classList.contains('verified')) {
            this.textContent = '取消申请';
          }
        });
        
        // Add mouseout event
        button.addEventListener('mouseout', function() {
          if (this.classList.contains('verified')) {
            this.textContent = originalText;
          }
        });
      }
    }
    
    // Initialize hover events for all verified buttons on page load
    function initializeButtonHoverEvents() {
      const taskButtons = document.querySelectorAll('button[data-task-id]');
      taskButtons.forEach(button => {
        const taskId = button.getAttribute('data-task-id');
        if (isTaskApplied(taskId)) {
          addButtonHoverEvents(button);
        }
      });
    }
    
    // Function to submit return link
    function submitReturnLink(taskId, button) {
      const dialogId = `return-link-dialog-${taskId}`;
      const dialog = document.getElementById(dialogId);
      
      if (dialog) {
        const inputField = dialog.querySelector('input');
        const returnLink = inputField ? inputField.value.trim() : '';
        
        if (!returnLink) {
          showNotification('请输入返链', 'error');
          return;
        }
        
        // Validate URL format
        if (!returnLink.startsWith('http://') && !returnLink.startsWith('https://')) {
          showNotification('请输入有效的URL地址', 'error');
          return;
        }
        
        // Save applied task with return link
        if (saveAppliedTask(taskId, returnLink)) {
          // Update button state
          if (button) {
            button.textContent = '已申请';
            button.classList.add('verified');
          }
          
          // Hide dialog
          dialog.style.display = 'none';
          
          showNotification('任务申请成功！', 'success');
        } else {
          showNotification('保存申请失败，请重试', 'error');
        }
      } else {
        console.error(`Dialog with ID ${dialogId} not found`);
        showNotification('提交返链失败，请重试', 'error');
      }
    }

    // Global variable to track navigation timeouts
    window.navigationTimeout = null;
    
    // Global function for consistent navigation
    function navigateTo(hash) {
      console.log(`Navigating to ${hash}`);
      
      // Clear any existing navigation timeouts
      if (window.navigationTimeout) {
        clearTimeout(window.navigationTimeout);
      }
      
      // Set the hash to navigate
      window.location.hash = hash;
      
      // Set a fallback timeout to force navigation if hash change doesn't trigger
      window.navigationTimeout = setTimeout(function() {
        if (window.location.hash !== hash) {
          console.log('Navigation timeout triggered, forcing reload');
          window.location.reload();
        }
      }, 2000);
      
      return false; // Prevent default behavior
    }
    
    // Global function to handle logo navigation
    function handleLogoClick(event) {
      if (event) {
        event.preventDefault();
      }
      console.log('Logo clicked, navigating to home page');
      return navigateTo('#/home');
    }
    
    // Global function for handling role toggle consistently across all pages
    function handleRoleToggle(event) {
      if (event) {
        event.preventDefault();
      }
      
      console.log('Role toggle clicked, updating role and navigating');
      
      try {
        const currentRole = localStorage.getItem('selectedRole') || UserRole.KOL;
        console.log('Current role:', currentRole);
        
        // Always toggle the role regardless of current page
        if (currentRole === UserRole.KOL) {
          localStorage.setItem('selectedRole', UserRole.PUBLISHER);
          console.log('Role changed to PUBLISHER, navigating to publisher page');
          window.location.hash = '#/publisher';
        } else {
          localStorage.setItem('selectedRole', UserRole.KOL);
          console.log('Role changed to KOL, navigating to sample tasks page');
          window.location.hash = '#/sample-tasks';
        }
        
        // Add a fallback navigation mechanism
        setTimeout(function() {
          const expectedHash = currentRole === UserRole.KOL ? '#/publisher' : '#/sample-tasks';
          if (window.location.hash !== expectedHash) {
            console.log('Navigation failed, forcing navigation');
            window.location.hash = expectedHash;
          }
        }, 500);
      } catch (error) {
        console.error('Error handling role toggle:', error);
        showNotification('切换角色时出错，请重试', 'error');
      }
      
      return false;
    }
    
    // Initialize the app
    window.onload = function() {
      // Initialize hover events for all verified buttons
      initializeButtonHoverEvents();
      
      // Check if we have a hash route
      const hashPath = window.location.hash.split('?')[0]; // Get the path part without query params
      
      if (hashPath === '#/sample-tasks') {
        renderSampleTasksPage();
      } else if (hashPath === '#/publisher') {
        renderPublisherPage();
      } else if (hashPath === '#/kol-profile') {
        renderSampleTasksPage(); // KOL profile is part of the sample tasks page
      } else if (hashPath === '#/home') {
        renderHomePage(); // New home page
      } else {
        renderLandingPage();
      }

      // Handle hash changes with enhanced error handling and logging
      window.addEventListener('hashchange', function() {
        const hashPath = window.location.hash.split('?')[0]; // Get the path part without query params
        console.log('Hash changed to:', hashPath);
        
        try {
          // Clear any existing navigation timeouts
          if (window.navigationTimeout) {
            clearTimeout(window.navigationTimeout);
            window.navigationTimeout = null;
          }
          
          // Track navigation start time for performance monitoring
          const navigationStartTime = new Date().getTime();
          console.log(`Starting navigation to ${hashPath} at ${navigationStartTime}`);
          
          if (hashPath === '#/sample-tasks') {
            renderSampleTasksPage();
          } else if (hashPath === '#/publisher') {
            renderPublisherPage();
          } else if (hashPath === '#/kol-profile') {
            renderSampleTasksPage(); // KOL profile is part of the sample tasks page
          } else if (hashPath === '#/home') {
            renderHomePage(); // New home page
          } else {
            renderLandingPage();
          }
          
          // Log navigation completion time
          const navigationEndTime = new Date().getTime();
          console.log(`Completed navigation to ${hashPath} in ${navigationEndTime - navigationStartTime}ms`);
        } catch (error) {
          console.error('Error rendering page:', error);
          showNotification('页面加载出错，请重试', 'error');
          // Fallback to landing page if rendering fails
          renderLandingPage();
        }
      });
    };
