<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ACF Engine</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .btn-standard {
      width: 120px !important;
      height: 40px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 0.5rem 1rem;
      background-color: #2563eb !important;
      color: white !important;
      border-radius: 0.375rem;
      transition: background-color 0.2s;
    }
    .btn-standard:hover {
      background-color: #1d4ed8 !important;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div id="app">
    <div class="min-h-screen flex flex-col items-center justify-center bg-gray-100">
      <div class="max-w-4xl w-full p-6">
        <div class="text-center mb-10">
          <h1 class="text-4xl font-extrabold text-blue-600">ACF Engine</h1>
          <p class="mt-3 text-xl text-gray-600">
            Connect KOLs with publishers for content creation
          </p>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- KOL Card -->
          <div 
            class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow cursor-pointer"
            id="kol-card"
          >
            <div class="p-8">
              <h2 class="text-2xl font-bold text-blue-600 mb-4">我是 KOL</h2>
              <p class="text-gray-600 mb-6">
                作为意见领袖，您可以接受品牌任务，在社交媒体上分享内容并获得报酬。
              </p>
              <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">支持 Twitter, Instagram, YouTube 等平台</span>
                <button class="btn-standard" style="width:120px !important; height:40px !important; display:flex !important; align-items:center !important; justify-content:center !important; background-color:#2563eb !important;">
                  查看任务
                </button>
              </div>
            </div>
          </div>
          
          <!-- Publisher Card -->
          <div 
            class="bg-white rounded-xl shadow-lg overflow-hidden hover:shadow-xl transition-shadow cursor-pointer"
            id="publisher-card"
          >
            <div class="p-8">
              <h2 class="text-2xl font-bold text-blue-600 mb-4">我是发布者</h2>
              <p class="text-gray-600 mb-6">
                作为品牌或营销机构，您可以发布任务，寻找合适的KOL为您的产品或服务进行推广。
              </p>
              <div class="flex justify-between items-center">
                <span class="text-sm text-gray-500">轻松管理营销活动</span>
                <button class="btn-standard" style="width:120px !important; height:40px !important; display:flex !important; align-items:center !important; justify-content:center !important; background-color:#2563eb !important;">
                  发布任务
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Add event listeners for the cards
    document.getElementById('kol-card').addEventListener('click', function() {
      window.location.href = 'index.html#/sample-tasks';
    });
    
    document.getElementById('publisher-card').addEventListener('click', function() {
      window.location.href = 'index.html#/publisher';
    });
  </script>
</body>
</html>
