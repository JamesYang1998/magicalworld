<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Twitter Authorization</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    .btn-standard {
      width: 120px !important;
      height: 40px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      text-align: center;
      padding: 0.5rem 1rem;
      background-color: #2563eb !important;
      color: white !important;
      border-radius: 0.375rem;
      transition: background-color 0.2s;
    }
    .btn-standard:hover {
      background-color: #1d4ed8 !important;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex flex-col items-center justify-center">
    <div class="max-w-md w-full bg-white shadow-lg rounded-lg overflow-hidden">
      <div class="p-6">
        <div class="flex items-center justify-center mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#1DA1F2">
            <path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723 10.054 10.054 0 01-3.127 1.184 4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>
          </svg>
          <h1 class="text-xl font-bold ml-2">Twitter Authorization</h1>
        </div>
        
        <div class="mb-6">
          <p class="text-gray-600 mb-4">ACF Engine requests access to your Twitter account to verify your identity and obtain the following information:</p>
          <ul class="list-disc pl-5 text-gray-600 mb-4">
            <li>Your profile information</li>
            <li>Your follower count</li>
            <li>Your tweet history</li>
          </ul>
          <p class="text-gray-600">We will not post any content without your permission.</p>
        </div>
        
        <div class="flex justify-center">
          <button id="authorize-btn" class="btn-standard w-full">
            Authorize Access
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('authorize-btn').addEventListener('click', function() {
      // Simulate authorization process
      setTimeout(function() {
        // Store mock data in localStorage
        const mockTwitterData = {
          username: 'kol_user123',
          followers_count: 5280,
          verified: true,
          profile_image: 'https://pbs.twimg.com/profile_images/default_profile.png',
          tweets: [
            {
              id: '1234567890',
              text: 'Excited to join the ACF Engine platform, looking forward to collaborating with brands! #KOL #DigitalMarketing',
              created_at: '2025-03-10T12:30:00Z',
              likes: 42,
              retweets: 12
            },
            {
              id: '1234567891',
              text: 'Just completed a cryptocurrency project promotion with great results! #Crypto #Marketing',
              created_at: '2025-03-05T09:15:00Z',
              likes: 38,
              retweets: 8
            },
            {
              id: '1234567892',
              text: 'Sharing some social media marketing tips, hope they help everyone! #SocialMedia #Tips',
              created_at: '2025-02-28T15:45:00Z',
              likes: 56,
              retweets: 23
            }
          ]
        };
        
        localStorage.setItem('twitter_auth_data', JSON.stringify(mockTwitterData));
        
        // Redirect directly to the sample tasks page with the success parameter
        window.location.href = 'index.html#/sample-tasks';
        
        // Set a flag in localStorage to indicate successful Twitter auth
        localStorage.setItem('twitter_auth_success', 'true');
      }, 1500); // Simulate network delay
      
      // Show loading state
      this.innerHTML = '<span class="animate-pulse">Authorizing...</span>';
      this.disabled = true;
    });
  </script>
</body>
</html>
