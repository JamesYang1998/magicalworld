app = "kol-backend"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  TWITTER_CLIENT_ID = "${TWITTER_CLIENT_IDI}"
  TWITTER_CLIENT_SECRET = "${TWITTER_CLIENT_SECRET}"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[statics]]
  guest_path = "/app/static"
  url_prefix = "/static"
