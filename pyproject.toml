[tool.poetry]
name = "kol-backend"
version = "0.1.0"
description = "Backend for ACF Engine KOL Platform"
authors = ["Devin AI"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.11"}
uvicorn = "^0.34.0"
sqlalchemy = "^2.0.39"
pydantic = "^2.10.6"
python-jose = {extras = ["cryptography"], version = "^3.4.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"
alembic = "^1.15.1"
openpyxl = "^3.1.5"
email-validator = "^2.2.0"
tweepy = "^4.15.0"
openai = "^1.66.3"
celery = "^5.4.0"
redis = "^5.2.1"
cryptography = "^42.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
